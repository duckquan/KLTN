{% extends 'base.html' %}
{% block content %}

<style>
    /* --- AUTHENTICATION LAYOUT --- */
    .auth-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        /* Đảm bảo căn giữa tuyệt đối trên mọi màn hình */
        box-sizing: border-box;
    }

    .auth-card {
        background: #ffffff;
        border-radius: 32px;
        padding: 45px;
        width: 100%;
        max-width: 450px; /* Độ rộng tối ưu cho form */
        box-shadow: 0 20px 60px rgba(0,0,0,0.05);
        border: 1px solid #f1f5f9;
        box-sizing: border-box;
    }

    /* --- TABS CHUYỂN ĐỔI --- */
    .auth-tabs {
        display: flex;
        gap: 25px;
        margin-bottom: 35px;
        border-bottom: 1px solid #f0f0f0;
    }

    .auth-tab {
        padding-bottom: 12px;
        cursor: pointer;
        font-weight: 700;
        font-size: 0.95rem;
        color: #999;
        transition: all 0.3s ease;
        border-bottom: 2px solid transparent;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .auth-tab.active {
        color: #1a1a1a;
        border-bottom-color: #1a1a1a;
    }

    /* --- FORM STYLES --- */
    .form-group-auth {
        margin-bottom: 22px;
        width: 100%;
        display: flex;
        flex-direction: column;
    }

    .form-group-auth label {
        font-size: 0.7rem;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--accent-gold);
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-align: left;
    }

    .input-auth {
        width: 100% !important; /* Ép rộng 100% */
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        font-weight: 500;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        /* Box-sizing giúp padding không làm phình kích thước ô */
        box-sizing: border-box !important; 
    }

    .input-auth:focus {
        outline: none;
        border-color: #1a1a1a;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(0,0,0,0.02);
    }

    /* --- BUTTON LOGIN/REGISTER --- */
    .btn-auth-action {
        background: #1a1a1a;
        color: #ffffff;
        border: none;
        width: 100% !important;
        padding: 16px;
        border-radius: 16px;
        font-weight: 700;
        font-size: 0.9rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-top: 10px;
        transition: all 0.3s ease;
        cursor: pointer;
        box-sizing: border-box;
    }

    .btn-auth-action:hover {
        background: #333333;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .btn-auth-action:active {
        transform: translateY(0);
    }

    /* --- FLASH MESSAGES --- */
    .alert-auth {
        padding: 14px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 25px;
        text-align: center;
        background: #fff5f5;
        color: #e53e3e;
        border: 1px solid #feb2b2;
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert-auth">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login" onclick="toggleAuth('login')">Đăng nhập</div>
            <div class="auth-tab" id="tab-register" onclick="toggleAuth('register')">Đăng ký</div>
        </div>

        <form id="login-form" action="{{ url_for('login') }}" method="POST">
            <div class="form-group-auth">
                <label>Username</label>
                <input type="text" name="username" class="input-auth" placeholder="Nhập tài khoản..." required>
            </div>
            <div class="form-group-auth">
                <label>Mật khẩu</label>
                <input type="password" name="password" class="input-auth" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-auth-action">Truy cập hệ thống</button>
        </form>

        <form id="register-form" action="{{ url_for('register') }}" method="POST" style="display: none;">
            <div class="form-group-auth">
                <label>Tạo Username</label>
                <input type="text" name="username" class="input-auth" placeholder="Ví dụ: linh_07" required>
            </div>
            <div class="form-group-auth">
                <label>Thiết lập mật khẩu</label>
                <input type="password" name="password" class="input-auth" placeholder="Tối thiểu 6 ký tự" required>
            </div>
            <button type="submit" class="btn-auth-action" style="background: #001f3f;">Tạo tài khoản mới</button>
        </form>
    </div>
</div>

<script>
    function toggleAuth(type) {
        const loginForm = document.getElementById('login-form');
        const regForm = document.getElementById('register-form');
        const tabLogin = document.getElementById('tab-login');
        const tabReg = document.getElementById('tab-register');

        if (type === 'login') {
            loginForm.style.display = 'block';
            regForm.style.display = 'none';
            tabLogin.classList.add('active');
            tabReg.classList.remove('active');
        } else {
            loginForm.style.display = 'none';
            regForm.style.display = 'block';
            tabLogin.classList.remove('active');
            tabReg.classList.add('active');
        }
    }
</script>

{% endblock %}
