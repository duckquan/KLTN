<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F-Distress Guard | AI FinTech Analysis</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- HỆ THỐNG BIẾN MÀU (Design System) --- */
        :root {
            --primary-navy: #001f3f;
            --accent-gold: #d4af37;
            --bg-body: #f8fafc; /* Màu nền sáng nhẹ hiện đại hơn */
            --text-main: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            --nav-height: 76px;
        }

        .dark-mode {
            --bg-body: #0f172a; /* Slate 900 */
            --text-main: #f1f5f9;
            --glass-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* --- GLOBAL RESET --- */
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        .glass-header {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            height: var(--nav-height);
            z-index: 1030; /* Cao hơn các thành phần khác */
        }

        .brand-logo {
            text-decoration: none;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary-navy);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dark-mode .brand-logo { color: #fff; }
        .brand-logo i { color: var(--accent-gold); font-size: 1.4rem; }

        .nav-link-custom {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
            opacity: 0.7;
        }
        .nav-link-custom:hover { opacity: 1; background: rgba(0,0,0,0.05); }
        .nav-link-custom.active { opacity: 1; color: var(--primary-navy); background: rgba(0, 31, 63, 0.08); }
        
        .dark-mode .nav-link-custom:hover { background: rgba(255,255,255,0.1); }
        .dark-mode .nav-link-custom.active { color: var(--accent-gold); background: rgba(255, 255, 255, 0.1); }

        /* --- BUTTONS & TOOLS --- */
        .theme-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
            cursor: pointer;
        }
        .theme-btn:hover { background: rgba(0,0,0,0.05); transform: rotate(15deg); }
        .dark-mode .theme-btn:hover { background: rgba(255,255,255,0.1); }

        .btn-auth {
            background: var(--primary-navy);
            color: #fff !important;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(0, 31, 63, 0.2);
        }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 31, 63, 0.3); }
        .dark-mode .btn-auth { background: #fff; color: var(--primary-navy) !important; }

        .dark-icon { display: none; }
        .light-icon { display: block; }
        .dark-mode .dark-icon { display: block; }
        .dark-mode .light-icon { display: none; }

        /* --- MAIN LAYOUT --- */
        .wrapper {
            flex: 1; /* Đẩy footer xuống đáy */
            padding-top: 2rem;
            padding-bottom: 4rem;
        }

        /* --- FOOTER --- */
        .footer-minimal {
            border-top: 1px solid var(--border-color);
            background: var(--glass-bg);
            padding: 2rem 0;
            margin-top: auto;
        }
    </style>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('darkMode');
            if (savedTheme === 'true') {
                document.documentElement.classList.add('dark-mode');
                document.body?.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body>

    <header class="glass-header sticky-top d-flex align-items-center">
        <div class="container-fluid px-4 px-lg-5">
            <div class="d-flex justify-content-between align-items-center w-100">
                
                <a class="brand-logo" href="/">
                    <i class="bi bi-shield-check"></i>
                    <span>F-GUARD</span>
                </a>

                <nav class="d-none d-md-flex gap-2">
                    {% if session.get('user_id') %}
                    <a href="{{ url_for('dashboard_page') }}" class="nav-link-custom {% if request.path == '/dashboard' %}active{% endif %}">
                        <i class="bi bi-grid-fill me-1"></i> Dashboard
                    </a>
                    <a href="{{ url_for('predictor_page') }}" class="nav-link-custom {% if request.path == '/predictor' %}active{% endif %}">
                        <i class="bi bi-cpu-fill me-1"></i> Predictor
                    </a>
                    {% endif %}
                </nav>

                <div class="d-flex align-items-center gap-3">
                    <button class="theme-btn" onclick="toggleDarkMode()" title="Giao diện Sáng/Tối">
                        <i class="bi bi-moon-stars-fill dark-icon"></i>
                        <i class="bi bi-sun-fill light-icon"></i>
                    </button>

                    {% if session.get('user_id') %}
                        <div class="d-none d-lg-block text-end me-2">
                            <div class="fw-bold" style="font-size: 0.7rem;">WELCOME BACK</div>
                            <div class="fw-bold" style="line-height: 1;">{{ session.get('username') }}</div>
                        </div>
                        <a href="{{ url_for('logout') }}" class="btn-auth" style="background: #dc2626 !important; color: white !important;">
                            <i class="bi bi-box-arrow-right"></i>
                        </a>
                    {% else %}
                        <a href="/" class="btn-auth">Login</a>
                    {% endif %}
                </div>

            </div>
        </div>
    </header>

    <main class="wrapper">
        <div class="container-fluid px-4 px-lg-5">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer-minimal text-center">
        <div class="container">
            <p class="mb-1 small fw-bold text-uppercase text-muted" style="letter-spacing: 2px;">F-Distress Guard System</p>
            <small class="text-muted opacity-75">&copy; 2026 FinTech Research Project. All rights reserved.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function toggleDarkMode() {
            const body = document.body;
            const html = document.documentElement;
            body.classList.toggle('dark-mode');
            html.classList.toggle('dark-mode');
            
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
        }
    </script>
</body>
</html>
